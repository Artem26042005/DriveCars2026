<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive Cars — Калькулятор</title>
  <link rel="stylesheet" href="style.css?v=1.0" />
  <script src="script.js?v=1.0" defer></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand"><span class="logo">DC</span><div><strong>Drive Cars</strong><small>Калькулятор вартості авто</small></div></div>
      <div class="tabs">
        <button class="tab active" data-tab="usa">США</button>
        <button class="tab" data-tab="europe">Європа</button>
      </div>
    </header>

    <section id="panel-usa" class="panel active">
      <div class="card form-card">
        <div class="section-head"><div><span class="eyebrow">Америка</span><h1>Розрахунок авто зі США</h1></div><div class="mode" data-scope="usa"><button class="mode-btn active" data-mode="with">З митом</button><button class="mode-btn" data-mode="without">Без мита</button></div></div>
        <div class="grid">
          <label>Вартість лоту, $<input id="usa-price" type="number" min="1" step="50" placeholder="Напр. 7500"></label>
          <label>Аукціон<select id="usa-auction"><option value="copart">Copart / IAAI</option></select></label>
          <label class="span-2">Майданчик<select id="usa-state"></select></label>
          <label>Тип пального<select id="usa-fuel"><option value="petrol">Бензин</option><option value="diesel">Дизель</option><option value="electric">Електро</option></select></label>
          <label>Рік випуску<input id="usa-year" type="number" min="1990" max="2030" placeholder="2021"></label>
          <label id="usa-engine-label">Об’єм двигуна, см³<input id="usa-engine" type="number" min="1" step="100" placeholder="2000"></label>
        </div>
        <button class="calc-btn" id="calc-usa">Розрахувати</button>
      </div>
      <div id="usa-results" class="results hidden"></div>
    </section>

    <section id="panel-europe" class="panel">
      <div class="card form-card">
        <div class="section-head"><div><span class="eyebrow">Європа</span><h1>Розрахунок авто з Європи</h1></div><div class="mode" data-scope="europe"><button class="mode-btn active" data-mode="with">З митом</button><button class="mode-btn" data-mode="without">Без мита</button></div></div>
        <div class="grid">
          <label>Вартість лоту, €<input id="eu-price" type="number" min="1" step="50" placeholder="Напр. 8500"></label>
          <label>Країна<select id="eu-country"></select></label>
          <label>Доставка по Європі, €<input id="eu-delivery" type="number" min="0" step="50" placeholder="Напр. 450"></label>
          <label>Тип пального<select id="eu-fuel"><option value="petrol">Бензин</option><option value="diesel">Дизель</option><option value="electric">Електро</option></select></label>
          <label>Рік випуску<input id="eu-year" type="number" min="1990" max="2030" placeholder="2021"></label>
          <label id="eu-engine-label">Об’єм двигуна, см³<input id="eu-engine" type="number" min="1" step="100" placeholder="2000"></label>
        </div>
        <button class="calc-btn" id="calc-europe">Розрахувати</button>
      </div>
      <div id="eu-results" class="results hidden"></div>
    </section>
  </main>
</body>
</html>
